# Install as /etc/sysctl.d/99-tailnet-bind.conf
#
# Lets a socket bind an address that does not exist yet.
#
# WHY. Fourteen containers on this host publish ports on the TAILNET address —
# `100.64.0.5:18082:8080` and friends. At boot, docker starts them before
# tailscaled has brought up tailscale0 and claimed that address, so the bind
# fails outright:
#
#     failed to set up container networking: driver failed programming external
#     connectivity on endpoint infisical: failed to bind host port
#     100.64.0.5:18082/tcp: cannot assign requested address
#
# and the container exits 128. Observed on the 2026-08-22 restart, where it took
# out infisical, grafana, prometheus, falkordb, open-webui, livekit — and
# traefik, which is why the whole estate stayed dark until it was started by
# hand.
#
# It self-heals ONLY PARTLY, which is the dangerous bit. Containers with a
# restart policy retry until tailscale0 appears and then come up fine; the ones
# without a policy, or whose retries were exhausted first, stay dead. So a
# restart leaves a random-looking subset of the fleet down, and whether traefik
# is in that subset is luck.
#
# ip_nonlocal_bind is the standard fix for exactly this shape of problem — it is
# what keepalived and HAProxy use to bind floating IPs before they are assigned.
# The socket binds immediately; once the address appears, packets are delivered
# to it. No ordering, no waiting, no retry loop.
#
# WHY NOT ORDER DOCKER AFTER TAILSCALE INSTEAD. An ExecStartPre that waits for
# 100.64.0.5 makes docker's startup depend on the tailnet coming up — and the
# tailnet is currently broken through Cloudflare, so on some future restart that
# wait would time out and delay every container on the box behind a control
# plane that has nothing to do with them. Coupling the container runtime to the
# VPN is a worse trade than relaxing one bind rule.
#
# The cost of this setting is that a typo'd bind address now succeeds silently
# instead of failing loudly. On a host that deliberately binds to an address
# assigned late, that trade is already implied.
net.ipv4.ip_nonlocal_bind = 1
