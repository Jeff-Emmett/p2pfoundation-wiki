<!-- Install as /etc/dbus-1/system.d/50-docker-max-connections.conf.
     Takes effect when dbus next reloads its configuration.

     WHY. On 2026-08-22 every container on GX10 stopped and none could start
     again. The visible error came from runc:

         unable to apply cgroup configuration: unable to start unit
         "docker-<id>.scope" ... was already loaded or has a fragment file

     which reads like a docker or cgroup fault and is not. The real cause was in
     the journal three lines earlier:

         dbus-daemon[1615]: [system] The maximum number of active connections
         for UID 0 has been reached (max_connections_per_user=256)

     Docker asks systemd to create one transient scope unit per container, over
     dbus, as root. GX10 runs 352 containers. The default cap of 256 connections
     per UID is therefore not a safety margin on this host — it sits BELOW the
     working set, so the machine lives permanently at the edge of it. Any burst
     of container churn exhausts the pool, systemd is left holding
     half-registered scope units, and from then on every container start fails
     until systemd's transient unit state is cleared.

     The failure mode is the nastiest kind: containers already running are
     untouched, so nothing looks wrong until something restarts — and then
     nothing can start at all, including traefik and every cloudflared tunnel.

     2048 is chosen to sit far above the container count with room for root's
     other dbus usage, rather than just above 352, so that adding a few services
     does not quietly walk the host back up to the same cliff. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <limit name="max_connections_per_user">2048</limit>
</busconfig>
