# NETCUP variant: the forum block is deliberately absent.
#
# forum.p2pfoundation.net is a REAL Discourse instance on this host (`p2pforum`)
# as of 2026-08-24. The GX10 copy of this file still serves a "coming soon" page
# there, which was true when only GX10 was up and is now the wrong answer. The
# compose file beside this one claims `ai.` only, so traefik never routes forum
# traffic here — but leaving a server block for a hostname that has a real
# service is the kind of dead config someone later reads as intent.

# One container, two hostnames, different page each. The alternative was two
# containers or a redirect to a shared page; both are worse. Two containers is
# twice the surface for something whose entire job is to be up, and a shared
# page cannot say anything specific about what is actually coming.
#
# Note there is no TLS here and no redirect to https: TLS terminates at
# Cloudflare and the tunnel delivers plain HTTP to traefik. A server block that
# redirects to https on this host would loop.

server {
    listen 80 default_server;
    server_name _;
    # Anything reaching this container that is not one of the two names below is
    # a routing mistake, and should look like one rather than silently serving
    # a page about a product the visitor did not ask for.
    return 404;
}

server {
    listen 80;
    server_name ai.p2pfoundation.net;
    root /usr/share/nginx/html;
    index ai.html;

    # Every path serves the placeholder rather than 404ing. These hostnames are
    # already in the wild and may be linked deeply; while there is nothing here
    # to link to, a visitor arriving at any URL should be told what is coming,
    # not shown an error.
    location = /base.css { try_files /base.css =404; }
    location / { try_files /ai.html =404; }

    # Short cache, because these pages are meant to be replaced. Cloudflare
    # honours this; a long TTL here means the real site stays invisible for
    # hours after it launches.
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
}
