# Netns holder for the netcup refugee tunnels.
#
# This replaced `socat TCP-LISTEN:80,fork`, which forks a process per connection
# and collapsed into Cloudflare 502s under a mere 8-way concurrent probe. It sits
# in front of ~450 hostnames, so it has to be event-driven, not fork-per-conn.
#
# Its job: accept inside the shared namespace on the ports the tunnels' ingress
# rules resolve to, and hand the request to traefik with the original Host intact.
worker_processes auto;
events { worker_connections 4096; }
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  access_log off;
  server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 0;
    location / {
      proxy_pass http://traefik:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 30s;
      proxy_read_timeout 300s;
    }
  }
}

# :443, added 2026-08-19. Not every netcup ingress rule says http://localhost:80.
# A handful — newsletter.p2pfoundation.net and translate.p2pfoundation.net among
# them — say `https://localhost:443` with noTLSVerify plus an originServerName,
# because on netcup those routers were TLS-terminated by traefik itself. With
# only :80 listening here, those hostnames answered Cloudflare 502 while every
# neighbour worked, which reads like a broken app rather than a missing port.
#
# TCP passthrough, not an http proxy: the TLS session must reach traefik intact
# so SNI still selects the router. cloudflared is told not to verify the cert, and
# public TLS is terminated at Cloudflare regardless, so traefik's default
# self-signed certificate is sufficient here.
stream {
  server {
    listen 443;
    proxy_pass traefik:443;
    proxy_connect_timeout 30s;
    proxy_timeout 300s;
  }
}
