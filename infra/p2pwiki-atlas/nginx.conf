server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Cloudflare speaks HTTP to this origin, so nginx builds absolute redirects
    # with scheme http:// and hands the visitor a downgrade. Relative Location
    # headers keep whatever scheme the browser already had.
    absolute_redirect off;
    port_in_redirect off;

    # /explore and /explore/ are the same page. Without this the bare path 404s
    # and every relative asset below it resolves one directory too high.
    location = /explore { return 301 /explore/; }

    location /explore/ {
        try_files $uri $uri/ /explore/index.html;

        # The payload is content-addressed by the build, not by filename, so a
        # long TTL would serve a stale corpus after a rebuild. An hour at the
        # edge with revalidation is the compromise; Cloudflare holds it longer.
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;

        # 3.5 MB of JSON and 2.2 MB of binary vectors; without this they go over
        # the wire uncompressed, which on a slow connection is the whole load.
        gzip on;
        gzip_types application/json application/octet-stream text/css application/javascript;
        gzip_min_length 1024;
        gzip_proxied any;
    }

    location = /explore/health { return 200 "ok\n"; add_header Content-Type text/plain; }
    location / { return 404; }
}
