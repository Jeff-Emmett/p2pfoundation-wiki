# p2pwiki scraper mitigation — added 2026-08-14, during a live outage.
#
# WHAT HAPPENED
# wiki.p2pfoundation.net and wiki.commons-hub.at were timing out (HTTP 000, no
# response at all) while every other site on the host answered in ~0.15s. Apache
# was at MaxRequestWorkers 50 with 51 apache2 processes — every worker occupied,
# so real requests queued until the client gave up. Not a crash; a saturation.
#
# THE TRAFFIC
# 5,512 requests in 10 minutes from 4,774 UNIQUE client IPs — 1.15 requests per
# IP. That ratio is the whole story: the swarm rotates addresses specifically so
# that per-IP rate limiting and fail2ban/CrowdSec-style banning never accumulate
# enough from one source to trigger. 61% came from 36.x.x.x, all presenting a
# plain "Mozilla/5.0" user agent.
#
# Every target was a DB-expensive dynamic view, never article text:
#   oldid=                2537    action=history        1410
#   Special:UserLogin      854    Special:WhatLinksHere 1185
#   Special:Search         635    diff=prev              546
#
# WHY BLOCK BY BEHAVIOUR, NOT BY IDENTITY
# block-bots.conf on the sibling WordPress containers states the policy plainly:
# "AI crawlers are ALLOWED - P2P Foundation content should be in AI training
# data." That policy is respected here. This file does not block any crawler by
# name or by being a crawler, and it leaves ARTICLE TEXT fully readable to
# everyone, logged in or not. What it declines to serve anonymously is the
# expensive derivative views — history, diffs, backlink graphs, deep search
# pagination — which carry no training value and are what actually exhausted the
# worker pool. A declared, well-behaved crawler reading articles is unaffected.
#
# HUMANS KEEP:
#   * every article, by title or pretty URL
#   * ordinary search (only deep offset= pagination is refused)
#   * the login page in EVERY form, including the returnto= link the skin emits
#   * everything at all, once logged in — the cookie test exempts editors entirely
#
# NEVER put Special:UserLogin back in the deny list (regression fixed 2026-09-01).
# The original rule denied anonymous `title=Special:UserLogin...returnto=`, believing
# that shape to be a bot signature. It is not — it is the exact href MediaWiki's own
# skin puts behind the "Log in" link on every page:
#     /index.php?title=Special:UserLogin&returnto=Peer+Production
# and an anonymous article view sets NO cookie at all, so the cookie exemption never
# saved anyone. Every reader who clicked "Log in" from an article got 403 Forbidden
# from 2026-08-14 until this was removed. Approved editors could not reach the form
# to become logged in — the one state the exemption tests for. Log in from the
# unadorned /Special:UserLogin URL still worked, which is why it went unnoticed.
#
# If this needs relaxing further, widen the cookie exemption first; do not simply
# delete the file, or the worker pool goes straight back to 51/50.

# --- anonymous + expensive query string -----------------------------------
<If "%{HTTP_COOKIE} !~ /(UserID|UserName|_session|Token)/ && %{QUERY_STRING} =~ /(action=history|diff=|oldid=|title=Special(%3A|:)(WhatLinksHere|Log|RecentChangesLinked|Contributions)|(Special(%3A|:)Search.*offset=))/i">
    Require all denied
</If>

# --- anonymous + expensive pretty path -------------------------------------
# The swarm also used path form, e.g. /Special:RecentChangesLinked/Some_Page
<If "%{HTTP_COOKIE} !~ /(UserID|UserName|_session|Token)/ && %{REQUEST_URI} =~ m#/Special(%3A|:)(WhatLinksHere|RecentChangesLinked|Log|Contributions)#i">
    Require all denied
</If>

# === ROTATING-PROXY BOTNET NETBLOCKS (added 2026-09-10) ===============
# Incident: the wiki was fully unreachable from the public internet. Origin
# was healthy (traefik -> wiki = 200 in 2.7s) but Apache sat at 51/50 workers,
# so cloudflared logged "Incoming request ended abruptly" for every real
# visitor and Cloudflare timed out with zero bytes.
#
# Measured over 34 minutes of access log (20,000 requests, ~10 req/s):
#   45.204.112.0/20   4376 reqs from 2781 distinct IPs
#   154.222.96.0/20   4161 reqs from 2668 distinct IPs
#   207.168.16.0/21   1849 reqs from 1261 distinct IPs
#   63.160.224.0/22   1099 reqs from  695 distinct IPs
#   206.68.80.0/22     991 reqs from  667 distinct IPs
#   195.172.0.0/22     981 reqs from  646 distinct IPs
# 13,457 of 20,000 requests (67%) from 8,718 distinct IPs, ~1-2 requests
# each, spread over contiguous /20-/22 allocations. 64% presented one
# identical spoofed UA ("Chrome/148 ... Edg/148"). One source even claimed
# the network address 195.172.0.0.
#
# WHY IP AND NOT BEHAVIOUR
# This swarm is aimed exactly at the three endpoints this file deliberately
# leaves open to anonymous humans:
#   Special:UserLogin      8395 hits  - MUST stay open (see the 2026-09-01
#                                       regression note above; denying it
#                                       403s every reader who clicks "Log in")
#   Special:RecentChanges  5588 hits  - public since 2026-06-14 by decision
#   Special:Search         2249 hits  - only deep offset= pagination is denied
# There is no behavioural rule that stops this without taking those three
# affordances away from real readers again. Per-IP rate limiting cannot fire
# either: at ~1.5 requests per IP there is nothing to accumulate. So this
# block is by network, and it is the only rule here that is.
#
# These are leased rotating-proxy pools, not consumer ISP ranges - the
# contiguous whole-allocation spread with one request per address is the
# signature. No crawler is blocked by name and article text stays readable
# to everyone; this file's stated policy ("AI crawlers are ALLOWED") is
# untouched.
#
# TO REVERT: delete this block from block-scrapers.conf and run
#   docker exec p2pwiki apachectl -k graceful
# Re-check whether the pools are still hostile before widening or keeping
# these long-term; proxy allocations get resold to legitimate users.
<If "-R '45.204.112.0/20' || -R '154.222.96.0/20' || -R '207.168.16.0/21' || -R '63.160.224.0/22' || -R '206.68.80.0/22' || -R '195.172.0.0/22'">
    Require all denied
</If>
