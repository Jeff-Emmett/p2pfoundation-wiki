name = "p2pwiki-edge-fallback"
main = "src/worker.js"
compatibility_date = "2026-08-17"

# The route is what puts this in front of the wiki. Until it exists, the Worker
# is deployed but inert — which is the safe order to do this in: deploy, test on
# the workers.dev URL, then add the route.
routes = [
  { pattern = "wiki.p2pfoundation.net/*", zone_name = "p2pfoundation.net" }
]

[vars]
# Kill switch. "off" makes the Worker a transparent pass-through to the origin
# without a redeploy:  wrangler deploy --var FALLBACK_ENABLED:off
FALLBACK_ENABLED = "on"

# The Internet Archive leg. Worth having, worth being able to switch off — it was
# itself returning 503 during the outage this was written for.
WAYBACK_ENABLED = "on"

# Shown in the banner when the R2 object carries no builtAt metadata.
SNAPSHOT_BUILT = "unknown"

# Rung 2 — the GX10 read-only standby (infra/p2pwiki/standby). Empty disables it.
# Must be a hostname on this zone with a tunnel pointing at GX10; same-zone
# subrequests bypass Workers, so there is no loop. Set once the tunnel exists:
#   STANDBY_ORIGIN = "https://wiki-standby.p2pfoundation.net"
STANDBY_ORIGIN = ""

# Stage 2. Uncomment once the bucket exists (see scripts/build-snapshot.py).
# Deploying with a binding to a bucket that does not exist FAILS the deploy, so
# this stays commented until `wrangler r2 bucket create p2pwiki-snapshot` has run.
# [[r2_buckets]]
# binding = "SNAPSHOT"
# bucket_name = "p2pwiki-snapshot"

# account_id is taken from `wrangler login` / CLOUDFLARE_ACCOUNT_ID.
