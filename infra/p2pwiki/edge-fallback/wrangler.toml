name = "p2pwiki-edge-fallback"
main = "src/worker.js"
compatibility_date = "2026-08-17"

# Required because this login sees two accounts ("cflare" and this one), and a
# non-interactive deploy cannot choose. This is the account that holds
# p2pfoundation.net and the existing cloudflared tunnels. An account ID is a
# public identifier, not a secret — it appears in dashboard URLs.
account_id = "0e7b3338d5278ed1b148e6456b940913"

# The route is what puts this in front of the wiki. Until it exists, the Worker
# is deployed but inert — which is the safe order to do this in: deploy, test on
# the workers.dev URL, then add the route.
routes = [
  { pattern = "wiki.p2pfoundation.net/*", zone_name = "p2pfoundation.net" }
]

[vars]
# Kill switch. "off" makes the Worker a transparent pass-through to the origin
# without a redeploy:  wrangler deploy --var FALLBACK_ENABLED:off
FALLBACK_ENABLED = "on"

# The Internet Archive leg. Worth having, worth being able to switch off — it was
# itself returning 503 during the outage this was written for.
WAYBACK_ENABLED = "on"

# Shown in the banner when the R2 object carries no builtAt metadata.
SNAPSHOT_BUILT = "unknown"

# Rung 2 — the GX10 read-only standby (infra/p2pwiki/standby). Empty disables it.
# Same-zone subrequests bypass Workers, so pointing at another hostname on this
# zone cannot loop back into this Worker.
# Live and verified 2026-08-17: 200, 35,497 bytes, "Peer to Peer - P2P Foundation Wiki".
STANDBY_ORIGIN = "https://wiki-standby.p2pfoundation.net"

# Stage 2. Uncomment once the bucket exists (see scripts/build-snapshot.py).
# Deploying with a binding to a bucket that does not exist FAILS the deploy, so
# this stays commented until `wrangler r2 bucket create p2pwiki-snapshot` has run.
# [[r2_buckets]]
# binding = "SNAPSHOT"
# bucket_name = "p2pwiki-snapshot"

# account_id is taken from `wrangler login` / CLOUDFLARE_ACCOUNT_ID.

# Health state for the cron probe (see the `scheduled` handler in worker.js).
[[kv_namespaces]]
binding = "HEALTH"
id = "51164151af7848909cc8e6c53b596a92"

# Every 15 minutes. Netcup is deactivated and GX10 now holds the only copy of
# the wiki, but nothing was watching GX10 — the dead-man's switch watches
# Netcup, the host that already died. This probe runs on Cloudflare, so it does
# not share a failure domain with the thing it is checking.
#
# The alert destination is a SECRET, not a var:
#     wrangler secret put ALERT_WEBHOOK
# (an ntfy topic URL is effectively a password, and this repo is public)
[triggers]
crons = ["*/15 * * * *"]
