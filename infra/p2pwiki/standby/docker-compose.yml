# p2pwiki READ-ONLY STANDBY — GX10 (spark, aarch64)
#
# A second copy of the wiki on our own metal, so an outage of the Netcup host
# does not take the wiki off the internet. Traffic reaches it only when the
# primary is unreachable; the edge Worker in ../edge-fallback decides that.
#
# DERIVED FROM ../docker-compose.yml. Same images, same MariaDB tuning, same
# hardening. Every deliberate difference is marked DELTA below — read those
# before assuming this is a drop-in copy of production.
#
#   DELTA 1  No Traefik labels. GX10 runs no Traefik; the standby is published
#            through its own cloudflared tunnel (see cloudflared service).
#   DELTA 2  Secrets come from .env, not /opt/infisical/secret-files/*.
#            Infisical is ON the host this standby exists to survive, so it
#            cannot be the source of the standby's credentials. Move to
#            Infisical refs ONLY if a reachable instance ever exists off-Netcup.
#   DELTA 3  No Elasticsearch. Production runs ES 7.10.2 for CirrusSearch, but
#            CirrusSearch is configured in LocalSettings.php, which lives only on
#            the Netcup host. Until that file can be copied over, an ES container
#            would burn 3 GB serving nothing. Add it back WITH the real
#            LocalSettings.php, not before.
#   DELTA 4  No p2pwiki-dumps nginx service. The standby does not publish dumps;
#            it consumes them.
#   DELTA 5  $wgReadOnly is set. This copy must never accept an edit — an edit
#            here is lost at failback, which is worse than a refusal.
#
# NOT YET IDENTICAL, and it cannot be until Netcup returns:
#   * LocalSettings.php  — not in the repo by design (holds SecretKey,
#                          UpgradeKey, DB creds). Lives at
#                          /opt/websites/p2pwiki/LocalSettings.php.
#   * extensions volume  — p2pwiki-extensions is a Docker volume on Netcup.
#   * images volume      — ~1.7 GB, published as a monthly tar at /dumps/.
#   * current DB         — the newest reachable content is the 2026-08-04 XML
#                          dump. The 08-16 db-dumps on the Hetzner box do NOT
#                          include p2pwiki; it is backed up via restic to a repo
#                          on Netcup's own storage.

services:
  p2pwiki-standby-db:
    image: mariadb:10.11
    container_name: p2pwiki-standby-db
    restart: unless-stopped
    mem_limit: 6G
    cpus: 4
    command: >
      --max-connections=500
      --wait-timeout=300
      --interactive-timeout=300
      --innodb-buffer-pool-size=1G
      --innodb-log-file-size=512M
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --max-allowed-packet=64M
      --table-open-cache=800
      --tmp-table-size=64M
      --max-heap-table-size=64M
      --thread-cache-size=50
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set in .env}
      MARIADB_DATABASE: p2pwiki
      MARIADB_USER: wikiuser
      MARIADB_PASSWORD: ${DB_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - p2pwiki-standby-db-data:/var/lib/mysql
    networks:
      - p2pwiki-standby-internal
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  p2pwiki-standby:
    image: mediawiki:1.40
    container_name: p2pwiki-standby
    command: ["bash", "-c", "a2enmod headers >/dev/null 2>&1; exec apache2-foreground"]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    depends_on:
      p2pwiki-standby-db:
        condition: service_healthy
    environment:
      MW_STANDBY: "1"
    volumes:
      - ./LocalSettings.php:/var/www/html/LocalSettings.php:ro
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./robots.txt:/var/www/html/robots.txt:ro
      - ./remoteip.conf:/etc/apache2/conf-enabled/remoteip.conf:ro
      - ./cache-images.conf:/etc/apache2/conf-enabled/cache-images.conf:ro
      - ./short-urls.conf:/etc/apache2/conf-enabled/short-urls.conf:ro
      - ./block-bots.conf:/etc/apache2/conf-enabled/block-bots.conf:ro
      - p2pwiki-standby-images:/var/www/html/images
      - ./dumps:/dumps
      # YouTube is the one extension Netcup runs that the mediawiki image does
      # not bundle. Mounted as a single subdirectory rather than shadowing the
      # whole extensions/ tree, so the image's bundled extensions stay intact.
      - ./extensions/YouTube:/var/www/html/extensions/YouTube:ro
    ports:
      # Bound to localhost only. Publication is the tunnel's job, and GX10 has
      # no Traefik to hide behind — an 0.0.0.0 bind here would put an
      # unauthenticated MediaWiki on the LAN and the tailnet.
      # 8081 is already taken on GX10 (something else answers there).
      - "127.0.0.1:18081:80"
    networks:
      - p2pwiki-standby-internal
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true

  # Publication. Two ways; pick ONE and uncomment it. See GO-LIVE.md step 1.
  #
  # -- OPTION A (recommended): remotely-managed, dashboard-created tunnel ------
  # Ingress lives in the Zero Trust dashboard; the connector only needs a token.
  # No origin cert, no credentials file, no config.yml — which matters here
  # because the local ~/.cloudflared/cert.pem is truncated (token block only,
  # no key or certificate) and every API call with it returns unauthorized.
  # Put the token in .env as TUNNEL_TOKEN.
  #
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-p2pwiki-standby
    restart: unless-stopped
    # Fails loudly if the token is missing rather than starting a connector that
    # registers nothing.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?set in .env}
    mem_limit: 256m
    networks:
      - p2pwiki-standby-internal

  #
  # -- OPTION B: locally-managed tunnel ---------------------------------------
  # Ingress lives in cloudflared-config.yml on this box. Needs a WORKING origin
  # cert to create the tunnel and its DNS record first. Prefer this only if you
  # want the routing under version control rather than in the dashboard.
  #
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared-p2pwiki-standby
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
  #   volumes:
  #     - ./cloudflared-config.yml:/etc/cloudflared/config.yml:ro
  #     - ./tunnel-credentials.json:/etc/cloudflared/creds.json:ro
  #   networks:
  #     - p2pwiki-standby-internal

volumes:
  p2pwiki-standby-db-data:
  p2pwiki-standby-images:

networks:
  p2pwiki-standby-internal:
