# Root-level short URLs for the standby: /Peer_to_Peer, not /index.php/Peer_to_Peer.
#
# Production gets this from a .htaccess plus htaccess-enable.conf (AllowOverride
# All). Neither the .htaccess nor LocalSettings.php is in the repo — both live
# only on the Netcup host — so the standby reconstructs the behaviour here, as a
# server config rather than a per-directory override. That is the better form
# anyway: no AllowOverride, no per-request .htaccess stat.
#
# This has to match production exactly. The edge Worker proxies paths like
# /Commons_Transition straight through, and every internal link in the rendered
# HTML is root-relative — if the standby only answered /index.php/Title, every
# link on every page would 404 the moment traffic failed over.
#
# Replace this file with the real .htaccess if production's rules ever turn out
# to differ in a way that matters.

<Directory /var/www/html>
    RewriteEngine On

    # Real files and MediaWiki's own entry points must win before the catch-all.
    RewriteRule ^/?images/          - [L]
    RewriteRule ^/?resources/       - [L]
    RewriteRule ^/?skins/           - [L]
    RewriteRule ^/?extensions/      - [L]
    RewriteRule ^/?(index|load|api|thumb|opensearch_desc|rest|img_auth)\.php - [L]

    # Anything that is not an existing file or directory is an article title.
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^(.*)$ %{DOCUMENT_ROOT}/index.php [L]
</Directory>
